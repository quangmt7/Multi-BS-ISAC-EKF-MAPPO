
ekf_parameters:
  # ----------------------------------------------------------------------------
  # 1. Mô hình động học mục tiêu (Kinematic Motion Model)
  # Vector trạng thái: s_m(t) = [x, y, z, v_x, v_y, v_z]^T (6 chiều)
  # Vector đo đạc tại BS b: e_{b,m}(t) = [r, theta, phi]^T (3 chiều: range, azimuth, elevation)
  # Mô hình: s_m(t+1) = F * s_m(t) + w_m(t)
  # ----------------------------------------------------------------------------
  state_dim: 6                         # Kích thước vector trạng thái: [x, y, z, vx, vy, vz]
  measurement_dim: 3                   # Kích thước vector đo đạc: [r, theta, phi]
  dt: 0.01                             # Bước thời gian Delta t (giây), tương ứng slot_duration_ms: 10.0 ms
  motion_model: "constant_velocity"     # Mô hình vận tốc không đổi (Constant Velocity - CV)

  # ----------------------------------------------------------------------------
  # 2. Ma trận hiệp phương sai nhiễu quá trình Q_m (Process Noise Covariance)
  # w_m(t) ~ N(0, Q_m)
  # Q_m mô tả sự không chắc chắn do chuyển động target
  # ----------------------------------------------------------------------------
  process_noise:
    # Mật độ phổ nhiễu gia tốc liên tục q_w (Continuous white noise acceleration)
    continuous_noise_spectral_density: 0.5
    # Phương sai nhiễu quá trình rời rạc theo vị trí và vận tốc:
    q_pos: 0.01                        # Nhiễu vị trí (m^2)
    q_vel: 0.1                         # Nhiễu vận tốc (m^2/s^2)
    # Vector đường chéo mặc định cho ma trận Q_m (kích thước 6x6)
    q_diag: [0.01, 0.01, 0.01, 0.1, 0.1, 0.1]

  # ----------------------------------------------------------------------------
  # 3. Trạng thái và Ma trận hiệp phương sai ban đầu (Initial Covariance)
  # ----------------------------------------------------------------------------
  initial_covariance:
    p_pos_init: 25.0                   # Phương sai ban đầu vị trí (m^2), std tương đương 5.0 m
    p_vel_init: 4.0                    # Phương sai ban đầu vận tốc (m^2/s^2), std tương đương 2.0 m/s
    # Vector đường chéo cho ma trận P_m(0|0) (kích thước 6x6)
    p_diag_init: [25.0, 25.0, 25.0, 4.0, 4.0, 4.0]

  # 4. Tham số sai số đo đạc tại BS (Measurement Noise Parameters: R_{b,m}(t))

  measurement_noise:
    sigma_range_0: 1.0                 # Sai số khoảng cách tham chiếu sigma_{d,0} (m)
    sigma_azimuth_0_rad: 0.0174533     # Sai số góc phương vị tham chiếu sigma_{theta,0} (rad ~ 1 độ)
    sigma_elevation_0_rad: 0.0174533   # Sai số góc cao tham chiếu sigma_{phi,0} (rad ~ 1 độ)
    gamma_0_db: 0.0                    # Sensing SINR tham chiếu Gamma_0 (dB)
    gamma_0_linear: 1.0                # Gamma_0 dạng tuyến tính (10^(gamma_0_db/10))

    # Khẩu độ số của antenna (Antenna Numerical Aperture)
    aperture:
      d_ap_theta_0: 1.0                # Khẩu độ tham chiếu góc phương vị D_{ap,theta,0}
      d_ap_phi_0: 1.0                  # Khẩu độ tham chiếu góc cao D_{ap,phi,0}
      d_ap_theta_b: 1.0                # Khẩu độ antenna BS góc phương vị D_{ap,theta,b}
      d_ap_phi_b: 1.0                  # Khẩu độ antenna BS góc cao D_{ap,phi,b}

    # Giới hạn an toàn số học (Numerical stability bounds)
    min_range_variance: 1.0e-4         # Phương sai khoảng cách tối thiểu (tránh ma trận R suy biến)
    max_range_variance: 1.0e4          # Phương sai khoảng cách tối đa (khi SINR xấp xỉ 0)
    min_angle_variance: 1.0e-6         # Phương sai góc tối thiểu (rad^2)
    max_angle_variance: 1.0e2          # Phương sai góc tối đa (rad^2)
  # 5. Tham số xác suất phát hiện mục tiêu (Detection Probability & False Alarm)
  detection:
    prob_false_alarm: 1.0e-4           # P_F: Xác suất báo động giả (False alarm probability)
    min_sensing_success_prob: 0.90     # P_m^{min}: Xác suất sensing thành công tối thiểu yêu cầu cho target m

  # ----------------------------------------------------------------------------
  # 6. Ngưỡng bất định ước lượng trạng thái (Uncertainty Limits)
  # U^{pos}_m(t) = tr(P^{pos}_m(t)), U^{vel}_m(t) = tr(P^{vel}_m(t))
  # Ràng buộc: U^{pos}_m(t) <= U^{pos,max}_m, U^{vel}_m(t) <= U^{vel,max}_m
  # ----------------------------------------------------------------------------
  uncertainty_limits:
    u_pos_max: 20.0                    # U^{pos,max}_m: Ngưỡng bất định vị trí tối đa cho phép (m^2)
    u_vel_max: 10.0                    # U^{vel,max}_m: Ngưỡng bất định vận tốc tối đa cho phép (m^2/s^2)

  # ----------------------------------------------------------------------------
  # 7. Cơ chế hợp nhất Multi-BS EKF (Multi-BS Batch Measurement Fusion)
  # ----------------------------------------------------------------------------
  fusion:
    method: "batch_matrix"             # Phương pháp gộp: ghép e_batch, H_batch, R_batch từ các BS detect thành công
    allow_empty_update: false          # Khi không có BS nào detect (B_det = rỗng): chỉ dự đoán (prediction only)
