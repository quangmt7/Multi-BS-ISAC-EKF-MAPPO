ekf_parameters:
  # 1. Mô hình động học mục tiêu (Target Kinematics — Constant Velocity)
  state_dim: 6                         # Kích thước vector trạng thái: [x, y, z, vx, vy, vz]
  measurement_dim: 3                   # Kích thước vector đo đạc: [range, azimuth, elevation]
  dt: 0.01                             # Bước thời gian Delta t = 10.0 ms = 0.01 s (đồng bộ system.yaml)
  motion_model: "constant_velocity"     # Mô hình chuyển động vận tốc không đổi (CV model)

  # 2. Ma trận hiệp phương sai nhiễu quá trình Q_m (Process Noise Covariance)
  #   - w_m(t) ~ N(0, Q_m)
  #   - q_s: cường độ nhiễu gia tốc liên tục = 0.4 m^2/s^3
  #   - Q_pos = (Delta_t^3 / 3) * q_s ≈ 1.333e-7 m^2
  #   - Q_vel = Delta_t * q_s = 4.0e-3 m^2/s^2
  # ----------------------------------------------------------------------------
  process_noise:
    continuous_noise_spectral_density: 0.4   # q_s: mật độ phổ nhiễu gia tốc (m^2/s^3)
    q_pos: 1.333e-7                          # Thành phần nhiễu vị trí rời rạc (m^2)
    q_vel: 4.0e-3                            # Thành phần nhiễu vận tốc rời rạc (m^2/s^2)
    # Vector đường chéo mặc định cho ma trận Q_m (6x6)
    q_diag: [1.333e-7, 1.333e-7, 1.333e-7, 4.0e-3, 4.0e-3, 4.0e-3]

  # ----------------------------------------------------------------------------
  # 3. Trạng thái và Ma trận hiệp phương sai ban đầu P_m(0|0) (Initial Covariance)
  # Khởi tạo độ bất định ban đầu của mục tiêu sau bước beam-sweeping
 
  initial_covariance:
    p_pos_init: 25.0                   # Phương sai ban đầu vị trí (m^2) — tương đương std = 5.0 m
    p_vel_init: 4.0                    # Phương sai ban đầu vận tốc (m^2/s^2) — tương đương std = 2.0 m/s
    # Vector đường chéo cho ma trận P ban đầu P_m(0|0) (6x6)
    p_diag_init: [25.0, 25.0, 25.0, 4.0, 4.0, 4.0]

  # ----------------------------------------------------------------------------
  # 4. Tham số sai số đo đạc phụ thuộc SINR 
  
  measurement_noise:
    sigma_range_0: 1.0                 # Sai số khoảng cách tham chiếu sigma_{d,0} = 1.0 m
    sigma_azimuth_0_rad: 0.0174533     # Sai số góc phương vị tham chiếu sigma_{theta,0} ≈ 1.0 độ (0.01745 rad)
    sigma_elevation_0_rad: 0.0174533   # Sai số góc cao tham chiếu sigma_{phi,0} ≈ 1.0 độ (0.01745 rad)

    # SINR tham chiếu Gamma_0 
    gamma_0_db: 10.0                   # Gamma_0 = 10.0 dB
    gamma_0_linear: 10.0               # Gamma_0 dạng tuyến tính = 10.0

    # Khẩu độ số antenna tham chiếu và thực tế
    aperture:
      d_ap_theta_0: 1.0                # Khẩu độ tham chiếu góc phương vị D_{ap,theta,0}
      d_ap_phi_0: 1.0                  # Khẩu độ tham chiếu góc cao D_{ap,phi,0}
      d_ap_theta_b: 1.0                # Khẩu độ antenna BS b góc phương vị D_{ap,theta,b}
      d_ap_phi_b: 1.0                  # Khẩu độ antenna BS b góc cao D_{ap,phi,b}

    # Giới hạn an toàn số học (Numerical stability limits)
    min_range_variance: 1.0e-4         # Phương sai khoảng cách tối thiểu (tránh suy biến)
    max_range_variance: 1.0e4          # Phương sai khoảng cách tối đa (khi SINR quá thấp)
    min_angle_variance: 1.0e-6         # Phương sai góc tối thiểu (rad^2)
    max_angle_variance: 1.0e2          # Phương sai góc tối đa (rad^2)


  # 5. Xác suất phát hiện và sensing thành công (Detection Probability)
  detection:
    prob_false_alarm: 1.0e-4           # P_F = 1.0e-4 (Xác suất báo động giả)
    min_sensing_success_prob: 0.90     # P_m^min = 0.90 (Xác suất sensing thành công tối thiểu yêu cầu)
    min_detection_prob: 0.90           # P_D^min = 0.90 (Xác suất phát hiện tối thiểu mỗi BS-target pair)

  # ----------------------------------------------------------------------------
  # 6. Ngưỡng bất định ước lượng trạng thái (Uncertainty Limits)

  uncertainty_limits:
    u_pos_max: 20.0                    # U_m^{pos,max} = 20.0 m^2 (Ngưỡng bất định vị trí tối đa)
    u_vel_max: 10.0                    # U_m^{vel,max} = 10.0 m^2/s^2 (Ngưỡng bất định vận tốc tối đa)

  # ----------------------------------------------------------------------------
  # 7. Hợp nhất đo đạc Multi-BS EKF (Batch Matrix Measurement Fusion)
  fusion:
    method: "batch_matrix"             # Gộp ma trận batch cho các BS phát hiện thành công
    allow_empty_update: false          # Khi không có BS nào detect: chỉ chạy prediction step
