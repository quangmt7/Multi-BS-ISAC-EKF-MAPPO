

system_parameters:
  num_bs: 5                            # Số lượng trạm cơ sở (Base Stations - BS)
  num_ue: 5                            # Số lượng người dùng truyền thông (UEs)
  num_target: 5                        # Số lượng mục tiêu cần cảm biến/theo dõi (Targets)
  num_prb: 100                         # Tổng số khối tài nguyên vật lý (PRB)
  bandwidth_mhz: 100.0                 # Tổng băng thông hệ thống (MHz)
  carrier_frequency_ghz: 3.5           # Tần số sóng mang trung tâm f_c (GHz)
  subcarrier_spacing_khz: 30.0         # Khoảng cách giữa các sóng mang con (SCS, 5G Numerology mu=1)
  prb_bandwidth_khz: 360.0             # Băng thông 1 PRB = 12 subcarriers * 30 kHz = 360 kHz
  slot_duration_ms: 10.0               # Thời lượng một khe thời gian Delta t (ms) = 0.01 s
  max_tx_power_dbm: 33.0               # Công suất phát cực đại của mỗi BS (dBm ~ 2.0 Watt)
  noise_psd_dbm_hz: -174.0             # Mật độ phổ công suất tạp âm nhiệt N0 (dBm/Hz)
  noise_figure_db: 7.0                 # Hệ số khuếch đại nhiễu đầu thu (Noise Figure)


  channel_and_interference:
    target_rcs_sqm: 1.0                # Diện tích phản xạ hiệu dụng radar của mục tiêu (RCS - m^2)
    pathloss_exponent_comm: 3.5        # Số mũ suy hao đường truyền thông (Communication Pathloss)
    pathloss_exponent_sensing: 2.0     # Số mũ suy hao một chiều radar (Two-way radar pathloss ~ d^-4)
    antenna_gain_tx_dbi: 15.0          # Độ lợi ăng-ten phát của BS (dBi)
    antenna_gain_rx_dbi: 15.0          # Độ lợi ăng-ten thu sensing của BS (dBi)
    c2s_leakage_eta0: 1.0e-3           # eta_0: Mức rò rỉ C2S tham chiếu (-30 dB = 10^-3)
    c2s_leakage_alpha: 1.0             # alpha: Hệ số suy giảm leakage theo khoảng cách PRB
    ibi_coupling_eta: 1.0e-2           # eta_{IBI}: Mức ghép nối nhiễu liên trạm BS (-20 dB = 10^-2)

  
  scenario:
    area_size_x_m: 1000.0              # Kích thước chiều X vùng mô phỏng (mét)
    area_size_y_m: 1000.0              # Kích thước chiều Y vùng mô phỏng (mét)
    area_size_z_m: 100.0               # Độ cao trần chiều Z vùng mô phỏng (mét)
    bs_height_m: 25.0                  # Độ cao đặt trạm BS (mét)
    ue_height_m: 1.5                   # Độ cao thiết bị UE (mét)
    target_height_min_m: 10.0          # Độ cao bay/di chuyển tối thiểu của target (mét)
    target_height_max_m: 60.0          # Độ cao tối đa của target (mét)
    target_velocity_min_mps: 5.0       # Tốc độ di chuyển tối thiểu của target (m/s ~ 18 km/h)
    target_velocity_max_mps: 25.0      # Tốc độ di chuyển tối đa của target (m/s ~ 90 km/h)

  simulation:
    num_slots_per_episode: 100         # Tập khe thời gian T = 100 slots mỗi episode (100 * 10ms = 1s)


  requirements:
    min_ue_rate_mbps: 1.0              # R_k^{min}: Tốc độ truyền thông tối thiểu nếu UE được phục vụ
    min_sensing_success_prob: 0.90     # P_m^{min}: Xác suất sensing thành công tối thiểu của mục tiêu
