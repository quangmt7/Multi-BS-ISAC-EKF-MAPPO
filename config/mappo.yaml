mappo_parameters:
  # 1. Hyperparameters thuật toán MAPPO / PPO
  ppo:
    lr_actor: 3.0e-4                   # Tốc độ học mạng Actor 
    lr_critic: 5.0e-4                  # Tốc độ học mạng Critic
    gamma: 0.99                        # Hệ số chiết khấu phần thưởng (Discount factor gamma = 0.99)
    gae_lambda: 0.95                   # Hệ số GAE lambda = 0.95
    clip_epsilon: 0.2                  # Biên độ PPO clipping epsilon = 0.2
    ppo_epochs: 4                     # Số epoch tối ưu hóa trên buffer mỗi lần cập nhật
    batch_size: 32                     # Kích thước mỗi mini-batch huấn luyện
    entropy_coef: 0.0001                 # Trọng số khuyến khích khám phá (Entropy bonus coefficient)
    value_loss_coef: 0.5               # Trọng số hàm mất mát của Critic (Value loss coefficient)
    max_grad_norm: 0.5                 # Ngưỡng cắt gradient chống bùng nổ (Gradient clipping)
    use_clipped_value_loss: false      # Sử dụng clipped value loss để huấn luyện Critic ổn định
    use_huber_loss: false              # FALSE: Sử dụng MSE loss (Mean Squared Error) cho Critic theo yêu cầu
    huber_delta: 10.0                  # (Không sử dụng khi use_huber_loss: false)
    use_linear_lr_decay: false         # Giảm dần tốc độ học tuyến tính theo tiến độ training

  # ----------------------------------------------------------------------------
  # 2. PRB-only action space; fixed transmit power per BWP

  action_space:
    power_action_type: "fixed"

  # ----------------------------------------------------------------------------
  # 3. Kiến trúc mạng nơ-ron (Actor & Critic Networks)
  # ----------------------------------------------------------------------------
  network:
    actor:
      hidden_dims: [256, 256]          # Kích thước các lớp ẩn của Actor
      activation: "tanh"               # Hàm kích hoạt tanh theo yêu cầu
      use_layer_norm: true             # Chuẩn hóa Layer Normalization
      orthogonal_init: true            # Khởi tạo trọng số trực giao (Orthogonal Initialization)
      gain: 0.01                       # Hệ số gain lớp output của Actor

    critic:

      hidden_dims: [256, 128]          # 2 lớp ẩn: 256 -> 128 (tối ưu cho activation tanh)
      activation: "tanh"               # Hàm kích hoạt tanh theo yêu cầu
      use_layer_norm: true             # Chuẩn hóa Layer Normalization
      orthogonal_init: true            # Khởi tạo trọng số trực giao
      gain: 1.0                        # Hệ số gain lớp output của Critic

  # ----------------------------------------------------------------------------
  # 4. Trọng số hàm mục tiêu tối ưu (Objective Weights)
  # alpha*f(AoI) + beta*(f(Upos)+f(Uvel))
  # + gamma*(3-sum(normalized_cost)) + lambda*(1-f(service)).
  # Step: sum theo target; frame SAC: mean theo target/slice, cost là mean subframe.
  # ----------------------------------------------------------------------------
  reward_weights:
    alpha_aoi: 0.25                     # alpha: AoI
    beta_uncertainty: 0.25              # beta: uncertainty
    gamma_power: 0.25                   # gamma: BWP cost benefit
    lambda_service: 0.25                # lambda: service benefit
  reward_shaping:
    k_aoi: 1.0                          # Hệ số suy giảm của hàm exp(-k_aoi * AoI / A_max)
    k_uncertainty: 1.0
    k_service: 1.0

  # ----------------------------------------------------------------------------
  # 5. Các giá trị chuẩn hóa (Normalization Constants)
  # Mốc chuẩn hóa AoI, bất định và công suất.
  # ----------------------------------------------------------------------------
  normalization:
    a_max: 20.0                        # A_max: Ngưỡng chuẩn hóa cực đại AoI (khe thời gian)
    u_pos_max: 50.0                   # Đồng bộ ngưỡng bất định vị trí trong ekf.yaml
    u_vel_max: 50.0                   # Đồng bộ ngưỡng bất định vận tốc trong ekf.yaml
    p_max_watt: 3.162                    # P_max: Công suất chuẩn hóa = 3.162 W


  # ----------------------------------------------------------------------------
  # 6. Subframe reward penalties (Eq. 9)
  penalties:
    c1_position: 0.5
    c2_velocity: 0.5
    c3_service: 0.5

  # ----------------------------------------------------------------------------
  # 7. Ràng buộc chỉ tiêu QoS (QoS Thresholds)

  # ----------------------------------------------------------------------------
  qos_constraints:
    r_min_ue_mbps: 1.0                 # R_k^min = 1.0 Mbps (Tốc độ truyền thông tối thiểu nếu được phục vụ)
    min_sensing_success_prob: 0.50     # P_m^min = 0.50 (Xác suất sensing thành công tối thiểu)

  # ----------------------------------------------------------------------------
  # 8. Tham số C2S/IBI chỉ được khai báo ở nguồn cấu hình vật lý:
  #    system.yaml -> system_parameters.channel_and_interference
  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  # 9. Quản lý quá trình huấn luyện (Training & Rollout Management)
  # ----------------------------------------------------------------------------
  training:
    total_episodes: 2000             # Tổng số episode huấn luyện; giống hierarchical.yaml để so sánh cùng số bước môi trường
    episode_length: 100              # T = 100 khe thời gian liên tiếp mỗi episode
    rollout_threads: 1                 # Số môi trường song song (nếu dùng vector env)
    save_interval: 50                  # Lưu checkpoint sau mỗi 50 episode
    update_interval: 1                # Cứ mỗi bao nhiêu episode thì cập nhật
    log_interval: 10                   # Ghi log kết quả sau mỗi 10 episode
    device: "cuda"                      # Thiết bị huấn luyện ("cuda" hoặc "cpu")
    seed: 42                           # Random seed cố định để tái lập kết quả
  # Bỏ eval_interval vì không cần thiết, khó đánh giá khi chạy ep dài nên không cần thiết,
  # có thể đánh giá qua biểu đồ cuối

